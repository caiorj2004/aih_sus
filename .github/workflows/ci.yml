name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Testes (dados, trava de SQL e agente com modelo falso)
        run: pytest -q
      - name: Dashboard sobe sem erros (Streamlit AppTest)
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("metricas:", [(m.label, m.value) for m in at.metric])
          PY
